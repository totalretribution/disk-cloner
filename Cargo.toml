[package]
name = "disk-cloner"
version = "0.1.0"
edition = "2021"
description = "CLI tool to image, restore and clone a whole disk using partclone"
license = "MIT"
readme = "README.md"
repository = "https://github.com/totalretribution/disk-cloner"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
zstd = "0.14.1"
sha2 = "0.11.0"
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[features]
# Build the egui front end: cargo build --release --features gui
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "disk-cloner"
path = "src/main.rs"

[[bin]]
name = "disk-cloner-gui"
path = "src/bin/disk-cloner-gui/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3

# --- Packaging (cargo-deb) ---
[package.metadata.deb]
maintainer = "totalretribution <totalretribution@users.noreply.github.com>"
section = "admin"
priority = "optional"
depends = "partclone, util-linux, zstd, gzip, pkexec | policykit-1"
extended-description = """\
disk-cloner images, restores and clones whole disks using partclone, copying \
only used filesystem blocks. Saves the partition table and a per-partition \
image, skips swap (recreated with mkswap on restore). Also writes .iso/.img \
images to a drive. Includes disk-cloner-gui, a desktop front end."""
assets = [
    ["target/release/disk-cloner", "usr/bin/", "755"],
    ["target/release/disk-cloner-gui", "usr/bin/", "755"],
    ["assets/disk-cloner.desktop", "usr/share/applications/", "644"],
    ["assets/icons/disk-cloner.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/disk-cloner/OFL-IBM-Plex.txt", "644"],
    ["README.md", "usr/share/doc/disk-cloner/README.md", "644"],
    ["LICENSE", "usr/share/doc/disk-cloner/LICENSE", "644"],
]

# --- Packaging (cargo-generate-rpm) ---
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/disk-cloner", dest = "/usr/bin/disk-cloner", mode = "755" },
    { source = "target/release/disk-cloner-gui", dest = "/usr/bin/disk-cloner-gui", mode = "755" },
    { source = "assets/disk-cloner.desktop", dest = "/usr/share/applications/disk-cloner.desktop", mode = "644" },
    { source = "assets/icons/disk-cloner.svg", dest = "/usr/share/icons/hicolor/scalable/apps/disk-cloner.svg", mode = "644" },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/doc/disk-cloner/OFL-IBM-Plex.txt", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/disk-cloner/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/disk-cloner/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
partclone = "*"
util-linux = "*"
zstd = "*"
gzip = "*"
polkit = "*"
